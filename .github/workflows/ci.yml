name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches ~/.gradle and the wrapper distribution; the wrapper stays the
      # single source of truth for the Gradle version.
      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: echo "name=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Check formatting-sensitive sources
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # CI never holds a signing key: release here is the standard unsigned
      # artifact, kept as a build-verification sideload for testers.
      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AstraHomework-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: AstraHomework-${{ steps.version.outputs.name }}-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize
        run: |
          {
            echo "### Artifacts"
            echo
            echo "| Variant | File | Signature |"
            echo "| --- | --- | --- |"
            echo "| debug | app-debug.apk | debug key |"
            echo "| release | app-release-unsigned.apk | **none** (signing happens in the release workflow) |"
          } >> "$GITHUB_STEP_SUMMARY"
