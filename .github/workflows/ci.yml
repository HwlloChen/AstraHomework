name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble and test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches ~/.gradle and the wrapper distribution; the wrapper stays the
      # single source of truth for the Gradle version.
      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        # baseVersion is the single literal the build script derives versionName from.
        run: echo "name=$(grep -oP 'val baseVersion\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Check formatting-sensitive sources
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # Release builds are debug-signed (no signing key in CI); the debug build
      # number is embedded so the app can distinguish which CI it runs.
      - name: Assemble debug and release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace -Pci.buildNumber=${{ github.run_number }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AstraHomework-${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # CI publishes a pre-release so the app can offer in-app CI updates.
      # The tag embeds the build number so every CI build is newer than the last.
      - name: Publish CI pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-ci.${{ github.run_number }}
          name: CI #${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            CI 构建 #${{ github.run_number }}（commit ${{ github.sha }}）

            这是自动构建的调试版本，仅供测试，不建议日常使用。

      # Release builds are debug-signed, so AGP emits a signed app-release.apk.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: AstraHomework-${{ steps.version.outputs.name }}-release-debug-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize
        run: |
          {
            echo "### Artifacts"
            echo
            echo "| Variant | File | Signature |"
            echo "| --- | --- | --- |"
            echo "| debug | app-debug.apk | debug key |"
            echo "| release | app-release.apk | debug key (signing for publishing happens in the release workflow) |"
          } >> "$GITHUB_STEP_SUMMARY"
